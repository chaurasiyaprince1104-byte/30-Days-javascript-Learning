<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child{
            background-color: black;
            padding: 34px;
            margin: 34px;
            border: 4px solid black;
            cursor: pointer;
        }
        .child-container{
            background-color: blue;
            color: white;
            margin: 14px;
            padding: 14px;
            border: 2px solid black;
        }
        .container{
            background-color: yellow;
            color: white;
            margin: 14px;
            padding: 14px;
            border: 2px solid black;
        
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="child-container">
            <div class="child">
                this is are child class 
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click",(e)=>{
            e.stopPropagation()
        alert("child was clicked")
        })
        document.querySelector(".child-container").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("child-container was click")
        })
        document.querySelector(".container").addEventListener("click",()=>{
            alert("container class was are you clicking")
        })
        function getrandom (){
    let val1 = Math.ceil(Math.random() * 255);
    let val3 = Math.ceil(Math.random() * 255);
    let val2 = Math.ceil(Math.random() * 255);

    return `rgb(${val1},${val2},${val3})`;
 }
        
     let a = setInterval(() =>{
            document.querySelector(".child-container").style.background = getrandom()
        },3000 )
        console.log(a)
    let b = setTimeout(()=>{
        document.querySelector(".child").style.background = getrandom()
    },5000)

    </script>
</body>
</html>
